<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Collection — HD FURNITURE & HOME DECORE</title><style>
body{margin:0;background:#f8f4ec;color:#3a2115;font-family:Arial,sans-serif}.container{max-width:1100px;margin:auto;padding:28px 20px}.back{color:#5a3827;text-decoration:none}.head{text-align:center;padding:35px 0}.head h1{font:42px Georgia,serif}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.product{background:#fffdf8;border:1px solid #ded2c0}.product img{width:100%;aspect-ratio:1/1;object-fit:cover}.info{padding:15px}.info h2{font:22px Georgia,serif;margin:0 0 8px}.info a{color:inherit;text-decoration:none}.price{font-weight:bold;margin-top:8px}@media(max-width:700px){.grid{grid-template-columns:1fr 1fr}.head h1{font-size:32px}}@media(max-width:450px){.grid{grid-template-columns:1fr}}
</style></head><body><div class="container"><a class="back" href="index.html">← Back to Home</a><div class="head"><div>SHOP</div><h1 id="title">Collection</h1></div><div id="grid">Loading...</div></div>
<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js';import {getFirestore,collection,getDocs} from 'https://www.gstatic.com/firebasejs/12.3.0/firebase-firestore.js';import {firebaseConfig} from './firebase-config.js';
const db=getFirestore(initializeApp(firebaseConfig));const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));const q=new URLSearchParams(location.search);const type=q.get('type')||'';document.getElementById('title').textContent=q.get('title')||'Collection';
async function load(){try{const a=(await getDocs(collection(db,'products'))).docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.order||0)-(b.order||0));document.getElementById('grid').className='grid';document.getElementById('grid').innerHTML=a.map(p=>{const img=(p.imageUrls&&p.imageUrls[0])||p.imageUrl||'';return `<article class="product"><img src="${esc(img)}" alt="${esc(p.name)}"><div class="info"><h2><a href="product.html?id=${encodeURIComponent(p.id)}">${esc(p.name)}</a></h2><div>${esc(p.category||'')}</div><div class="price">₹${esc(p.price||'')}</div></div></article>`}).join('')||'<p>No products found.</p>'}catch(e){document.getElementById('grid').innerHTML='<p>Could not load products.</p>';console.error(e)}}load();
</script></body></html>
