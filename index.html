<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>HD Furniture & Home Decore</title>
<style>
:root{--w:#5a3825;--d:#3d2519;--b:#f3eadb;--c:#fbf7ef;--m:#76685b}
*{box-sizing:border-box}body{margin:0;background:var(--c);color:#2e241d;font-family:Georgia,serif}a{text-decoration:none;color:inherit}.container{width:min(1180px,92%);margin:auto}
header{position:sticky;top:0;z-index:10;background:rgba(251,247,239,.97);border-bottom:1px solid #dfd1bd}.nav{min-height:72px;display:flex;align-items:center;justify-content:space-between}.brand{font-size:22px;font-weight:700;color:var(--d)}nav{display:flex;gap:25px;font:14px Arial,sans-serif}
.hero{background:linear-gradient(120deg,var(--b),#e8dbc6);padding:85px 0}.heroGrid{display:grid;grid-template-columns:1.05fr .95fr;gap:50px;align-items:center}.eyebrow{text-transform:uppercase;letter-spacing:3px;font:600 12px Arial,sans-serif;color:var(--w)}h1{font-size:clamp(42px,6vw,72px);line-height:1.03;margin:15px 0 20px;color:var(--d)}.hero p{font:16px/1.8 Arial,sans-serif;color:var(--m)}.btn{display:inline-block;margin-top:25px;padding:13px 24px;background:var(--w);color:#fff;font:600 14px Arial,sans-serif;border:0;cursor:pointer}.heroImage{height:390px;background:#765238 center/cover no-repeat;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#f8eee0;font:600 18px Arial,sans-serif;letter-spacing:2px;text-transform:uppercase}
section{padding:70px 0}.alt{background:var(--b)}.head{text-align:center;margin-bottom:35px}.head h2{font-size:38px;color:var(--d);margin:8px 0}.cats,.products,.cols{display:grid;gap:18px}.cats{grid-template-columns:repeat(3,1fr)}.cat{background:#fffdf9;border:1px solid #dfd1bd;padding:32px;text-align:center}.cat h3{margin:0;color:var(--w);font-size:22px}.cat p,.product p,.col p{font:13px Arial,sans-serif;color:var(--m)}.products{grid-template-columns:repeat(4,1fr)}.product{background:#fff;border:1px solid #dfd1bd}.product img{width:100%;aspect-ratio:1;object-fit:cover}.pi{padding:15px}.pi h3{margin:0;font-size:18px}.price{display:block;margin-top:8px;color:var(--w);font:700 16px Arial}.cols{grid-template-columns:1fr 1fr}.col{min-height:300px;padding:30px;background:#765238 center/cover no-repeat;color:#fff;display:flex;flex-direction:column;justify-content:flex-end}.col h3{font-size:30px;margin:0}.about{text-align:center;max-width:820px}.about p{font:16px/1.9 Arial,sans-serif;color:var(--m)}.contact{display:grid;grid-template-columns:1fr 1fr;gap:30px;background:#fffdf9;border:1px solid #dfd1bd;padding:35px}.form{display:grid;gap:12px}.form input,.form textarea{width:100%;padding:13px;border:1px solid #d8c8b4;background:#fff;font:14px Arial}.form textarea{min-height:120px}footer{background:var(--d);color:#eee0ce;padding:40px 0}footer p{font:13px Arial,sans-serif}
@media(max-width:850px){nav{gap:12px;font-size:12px}.heroGrid,.contact{grid-template-columns:1fr}.cats{grid-template-columns:repeat(2,1fr)}.products{grid-template-columns:repeat(2,1fr)}}
@media(max-width:520px){nav{display:none}.cats,.products,.cols{grid-template-columns:1fr}h1{font-size:44px}}

.galleryViewer{position:fixed;inset:0;background:rgba(0,0,0,.82);display:none;align-items:center;justify-content:center;z-index:99999;padding:24px}
.galleryViewer.show{display:flex}
.galleryBox{position:relative;max-width:94vw;max-height:94vh;background:#fff;padding:12px;border-radius:6px;display:flex;flex-direction:column;align-items:center}
.galleryBox img{max-width:88vw;max-height:78vh;object-fit:contain}
.galleryClose,.galleryPrev,.galleryNext{position:absolute;border:0;background:#fff;color:#333;border-radius:50%;width:44px;height:44px;font-size:28px;cursor:pointer;z-index:2;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.galleryClose{right:-18px;top:-18px}.galleryPrev{left:12px;top:50%;transform:translateY(-50%)}.galleryNext{right:12px;top:50%;transform:translateY(-50%)}
.galleryThumbs{display:flex;gap:7px;overflow:auto;max-width:88vw;padding-top:10px}
.galleryThumb{width:64px;height:64px;object-fit:cover;border:2px solid #ddd;cursor:pointer}
.galleryHint{font:12px Arial,sans-serif;color:#76685b;margin-top:7px}
.productMainImage{cursor:pointer}
.productMainImage:hover{opacity:.9}
</style>
</head>
<body>
<header><div class="container nav"><a id="brand" class="brand" href="#home">HD FURNITURE &amp; HOME DECORE</a><nav><a id="nHome" href="#home">Home</a><a id="nFurniture" href="#furniture">Furniture</a><a id="nDecor" href="#decor">Home Décor</a><a id="nNew" href="#new">New Arrivals</a><a id="nContact" href="#contact">Contact</a></nav></div></header>
<section id="home" class="hero"><div class="container heroGrid"><div><div id="heroEyebrow" class="eyebrow"></div><h1 id="heroTitle"></h1><p id="heroText"></p><a id="heroButton" class="btn" href="#featured"></a></div><div id="heroImage" class="heroImage">Product Image Area</div></div></section>
<section><div class="container"><div class="head"><div class="eyebrow">Explore</div><h2 id="categoryHeading">Shop by Category</h2></div><div id="cats" class="cats"></div></div></section>
<section id="featured" class="alt"><div class="container"><div class="head"><div class="eyebrow">Collection</div><h2 id="featuredHeading">Featured Products</h2></div><div id="featuredProducts" class="products"></div></div></section>
<section id="furniture"><div class="container"><div class="head"><div class="eyebrow">Collection</div><h2 id="furnitureHeading">Furniture Collection</h2></div><div id="furnitureCols" class="cols"></div></div></section>
<section id="decor" class="alt"><div class="container"><div class="head"><div class="eyebrow">Collection</div><h2 id="decorHeading">Home Décor Collection</h2></div><div id="decorCols" class="cols"></div></div></section>
<section id="new"><div class="container"><div class="head"><div class="eyebrow">Latest</div><h2 id="newHeading">New Arrivals</h2></div><div id="newProducts" class="products"></div></div></section>
<section class="alt"><div class="container about"><div class="head"><div id="aboutEyebrow" class="eyebrow"></div><h2 id="aboutTitle"></h2></div><p id="aboutText"></p></div></section>
<section id="contact"><div class="container"><div class="head"><div id="contactEyebrow" class="eyebrow"></div><h2 id="contactTitle"></h2></div><div class="contact"><div><p id="contactText"></p><p id="details"></p></div><form id="inq" class="form"><input id="iName" placeholder="Name" required><input id="iPhone" placeholder="Phone" required><textarea id="iMsg" placeholder="Your inquiry" required></textarea><button class="btn">Send Inquiry</button><div id="iStatus"></div></form></div></div></section>
<footer><div class="container"><h3 id="footerBrand"></h3><p id="footerText"></p></div></footer>

<div id="galleryViewer" class="galleryViewer" aria-hidden="true">
  <div class="galleryBox">
    <button type="button" class="galleryClose" id="galleryClose">×</button>
    <button type="button" class="galleryPrev" id="galleryPrev">‹</button>
    <img id="galleryMain" src="" alt="Product image">
    <button type="button" class="galleryNext" id="galleryNext">›</button>
    <div id="galleryThumbs" class="galleryThumbs"></div>
    <div class="galleryHint">Click outside or × to close</div>
  </div>
</div>

<script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js';
import{getFirestore,getDoc,doc,getDocs,collection,addDoc,serverTimestamp}from'https://www.gstatic.com/firebasejs/12.3.0/firebase-firestore.js';
import{firebaseConfig}from'./firebase-config.js';
const app=initializeApp(firebaseConfig),db=getFirestore(app),$=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const galleryViewer=$('galleryViewer'),galleryMain=$('galleryMain'),galleryThumbs=$('galleryThumbs');
let galleryProducts=[],galleryProductIndex=0,galleryImages=[],galleryImageIndex=0;
window.openProductGallery=function(list,index){
  galleryProducts=list||[];galleryProductIndex=index||0;galleryImages=galleryProducts[galleryProductIndex]?.imageUrls?.length?galleryProducts[galleryProductIndex].imageUrls:(galleryProducts[galleryProductIndex]?.imageUrl?[galleryProducts[galleryProductIndex].imageUrl]:[]);
  galleryImageIndex=0;renderGallery();galleryViewer.classList.add('show');galleryViewer.setAttribute('aria-hidden','false');
};
function renderGallery(){if(!galleryImages.length)return;galleryMain.src=galleryImages[galleryImageIndex];galleryThumbs.innerHTML=galleryImages.map((x,i)=>`<img class="galleryThumb" src="${esc(x)}" data-gi="${i}">`).join('');galleryThumbs.querySelectorAll('[data-gi]').forEach(x=>x.onclick=()=>{galleryImageIndex=Number(x.dataset.gi);renderGallery()});}
function closeGallery(){galleryViewer.classList.remove('show');galleryViewer.setAttribute('aria-hidden','true');galleryMain.src='';galleryThumbs.innerHTML='';}
$('galleryClose').onclick=closeGallery;
$('galleryPrev').onclick=()=>{if(galleryImages.length){galleryImageIndex=(galleryImageIndex-1+galleryImages.length)%galleryImages.length;renderGallery()}};
$('galleryNext').onclick=()=>{if(galleryImages.length){galleryImageIndex=(galleryImageIndex+1)%galleryImages.length;renderGallery()}};
galleryViewer.onclick=e=>{if(e.target===galleryViewer)closeGallery()};
document.addEventListener('keydown',e=>{if(!galleryViewer.classList.contains('show'))return;if(e.key==='Escape')closeGallery();if(e.key==='ArrowLeft')$('galleryPrev').click();if(e.key==='ArrowRight')$('galleryNext').click()});

const text=(id,v)=>$(id).textContent=v||'';
const product=(p,i)=>{const im=p.imageUrls?.[0]||p.imageUrl||'';return`<article class="product"><img class="productMainImage" data-product-index="${i}" src="${esc(im)}" alt="${esc(p.name)}"><div class="pi"><h3>${esc(p.name)}</h3><p>${esc(p.category)}</p><strong class="price">${esc(p.price)}</strong><p>${esc(p.description||'')}</p></div></article>`};
async function load(){const site=(await getDoc(doc(db,'siteContent','site'))).data()||{};for(const [id,key] of Object.entries({brand:'brandName',nHome:'homeNav',nFurniture:'furnitureNav',nDecor:'decorNav',nNew:'newNav',nContact:'contactNav',heroEyebrow:'heroEyebrow',heroTitle:'heroTitle',heroText:'heroText',heroButton:'heroButton',categoryHeading:'categoryHeading',featuredHeading:'featuredHeading',furnitureHeading:'furnitureHeading',decorHeading:'decorHeading',newHeading:'newHeading'}))text(id,site[key]);if(site.heroImageUrl)$('heroImage').style.backgroundImage=`url("${site.heroImageUrl}")`;
const biz=(await getDoc(doc(db,'siteContent','business'))).data()||{};for(const [id,key] of Object.entries({aboutEyebrow:'aboutEyebrow',aboutTitle:'aboutTitle',aboutText:'aboutText',contactEyebrow:'contactEyebrow',contactTitle:'contactTitle',contactText:'contactText',footerBrand:'footerBrand',footerText:'footerText'}))text(id,biz[key]);text('details',[biz.phone,biz.email,biz.whatsapp,biz.address].filter(Boolean).join(' · '));
const cats=(await getDocs(collection(db,'categories'))).docs.map(d=>d.data());$('cats').innerHTML=cats.map(c=>`<a class="cat" href="#${esc(c.target||'featured')}"><h3>${esc(c.name)}</h3><p>${esc(c.subtitle||'')}</p></a>`).join('');
const ps=(await getDocs(collection(db,'products'))).docs.map(d=>d.data()).sort((a,b)=>(a.order||0)-(b.order||0));const featured=ps.filter(p=>p.featured);const featuredList=featured.length?featured:ps.slice(0,8);
$('featuredProducts').innerHTML=featuredList.map(product).join('');
$('newProducts').innerHTML=ps.filter(p=>p.newArrival).map(product).join('');
function bindGallery(container,list){$(container).querySelectorAll('.productMainImage').forEach(el=>el.onclick=()=>window.openProductGallery(list,Number(el.dataset.productIndex)));}
bindGallery('featuredProducts',featuredList);bindGallery('newProducts',ps.filter(p=>p.newArrival));
const cs=(await getDocs(collection(db,'collections'))).docs.map(d=>d.data());const col=c=>`<div class="col" style="background-image:url('${esc(c.imageUrl||'')}')"><h3>${esc(c.title)}</h3><p>${esc(c.description||'')}</p></div>`;$('furnitureCols').innerHTML=cs.filter(c=>c.type==='furniture').map(col).join('');$('decorCols').innerHTML=cs.filter(c=>c.type==='decor').map(col).join('')};load();
$('inq').onsubmit=async e=>{e.preventDefault();$('iStatus').textContent='Sending...';try{await addDoc(collection(db,'inquiries'),{name:$('iName').value.trim(),phone:$('iPhone').value.trim(),message:$('iMsg').value.trim(),status:'New',createdAt:serverTimestamp()});e.target.reset();$('iStatus').textContent='Inquiry sent successfully.'}catch(e){$('iStatus').textContent='Could not send inquiry.'}};
</script>
</body>
</html>
