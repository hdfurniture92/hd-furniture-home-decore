<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product Details — HD FURNITURE & HOME DECORE</title>
<style>
body{margin:0;background:#f8f4ec;color:#3a2115;font-family:Arial,sans-serif}.container{max-width:1100px;margin:auto;padding:28px 20px}.back{display:inline-block;margin-bottom:20px;color:#5a3827;text-decoration:none}.details{display:grid;grid-template-columns:1fr 1fr;gap:40px;background:#fffdf8;padding:28px}.main-img{width:100%;max-height:600px;object-fit:contain;background:#f3eee4}.thumbs{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}.thumbs img{width:75px;height:75px;object-fit:cover;cursor:pointer;border:1px solid #d8cbb9}.eyebrow{text-transform:uppercase;letter-spacing:3px;font-size:12px}.title{font-family:Georgia,serif;font-size:42px;margin:12px 0}.price{font-size:24px;font-weight:bold;margin:18px 0}.meta{line-height:1.8}.inquiry{display:inline-block;margin-top:20px;background:#5a3827;color:#fff;padding:13px 20px;text-decoration:none}.error{padding:30px;background:#fff3f0}@media(max-width:700px){.details{grid-template-columns:1fr}.title{font-size:32px}}
</style>
</head><body>
<div class="container"><a class="back" href="index.html">← Back to Home</a><div id="app">Loading product...</div></div>
<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js';
import {getFirestore,doc,getDoc} from 'https://www.gstatic.com/firebasejs/12.3.0/firebase-firestore.js';
import {firebaseConfig} from './firebase-config.js';
const db=getFirestore(initializeApp(firebaseConfig));
const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const id=new URLSearchParams(location.search).get('id');
async function load(){if(!id){app.innerHTML='<div class="error">Product not found.</div>';return}try{const s=await getDoc(doc(db,'products',id));if(!s.exists()){app.innerHTML='<div class="error">Product not found.</div>';return}const p=s.data();const imgs=Array.isArray(p.imageUrls)&&p.imageUrls.length?p.imageUrls:(p.imageUrl?[p.imageUrl]:[]);app.innerHTML=`<div class="details"><div><img id="mainImg" class="main-img" src="${esc(imgs[0]||'')}" alt="${esc(p.name)}"><div class="thumbs">${imgs.map((x,i)=>`<img data-i="${i}" src="${esc(x)}" alt="${esc(p.name)} image ${i+1}">`).join('')}</div></div><div><div class="eyebrow">${esc(p.category)}</div><h1 class="title">${esc(p.name)}</h1><div class="price">₹${esc(p.price)}</div>${p.description?`<p>${esc(p.description)}</p>`:''}<div class="meta">${p.dimensions?`<div><strong>Dimensions:</strong> ${esc(p.dimensions)}</div>`:''}${p.material?`<div><strong>Material:</strong> ${esc(p.material)}</div>`:''}</div><a class="inquiry" href="index.html#contact">Send Inquiry</a></div></div>`;document.querySelectorAll('[data-i]').forEach(x=>x.onclick=()=>mainImg.src=imgs[Number(x.dataset.i)]);}catch(e){app.innerHTML='<div class="error">Could not load product details.</div>';console.error(e)}}load();
</script></body></html>
